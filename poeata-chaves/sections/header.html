<!-- ============ POEATA CHAVES — HEADER (nav avec logo bulle + hero) ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psh,.psh *{margin:0;padding:0;box-sizing:border-box}
.psh{--vert:#121F18;--mauve:#BCA9B7;--sauge:#94BDB7;--creme:#F2F2F2;
  font-family:'Inter',sans-serif;position:relative;width:100%;line-height:1.6;-webkit-font-smoothing:antialiased}
.psh a{color:inherit;text-decoration:none}

/* ===== NAV ===== */
.psh-nav{position:fixed;top:0;left:0;width:100%;z-index:60;padding:18px 44px;display:flex;justify-content:space-between;align-items:center;transition:all .5s}
.psh-nav.scr{background:rgba(242,242,242,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:12px 44px;border-bottom:1px solid rgba(18,31,24,.08)}
.psh-logo{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:21px;color:var(--vert)}
.psh-logo em{font-style:italic;color:var(--mauve)}
/* mini bulle de verre (logo) */
.psh-bubble{position:relative;width:38px;height:38px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 4px 12px rgba(120,130,180,.3)}
.psh-bubble::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 46%, rgba(255,255,255,.4), rgba(255,255,255,.1) 52%, transparent 78%),
    conic-gradient(from 200deg,#ff6db5,#ffcf5a,#5cf0c4,#5ab0ff,#c46dff,#ff6db5);
  filter:saturate(1.25);animation:psh-spin 16s linear infinite}
.psh-bubble::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(60% 42% at 34% 22%,rgba(255,255,255,.95),transparent 60%),radial-gradient(circle at 50% 7%,rgba(255,255,255,.8),transparent 24%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset -6px -8px 16px rgba(80,92,150,.4)}
@keyframes psh-spin{to{transform:rotate(360deg)}}
.psh-links{display:flex;gap:34px;align-items:center;list-style:none}
.psh-links a{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--vert);transition:color .3s}
.psh-links a:hover{color:var(--mauve)}
.psh-cta{padding:11px 24px;border:1px solid var(--vert);border-radius:50px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:all .4s}
.psh-cta:hover{background:var(--vert);color:var(--creme)}
.psh-burger{display:none;flex-direction:column;gap:6px;background:none;border:none;cursor:pointer}
.psh-burger span{width:25px;height:1.5px;background:var(--vert)}

/* ===== HERO ===== */
.psh-hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:radial-gradient(circle at 22% 18%,rgba(255,170,205,.28),transparent 45%),
            radial-gradient(circle at 82% 26%,rgba(150,200,235,.28),transparent 45%),
            radial-gradient(circle at 60% 88%,rgba(150,225,210,.26),transparent 48%),
            radial-gradient(circle at 30% 80%,rgba(200,170,235,.24),transparent 48%),
            var(--creme)}
/* éclats de prisme dispersés (attrape-soleil) */
.psh-flecks{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.psh-flecks .glow{position:absolute;top:-15%;left:-12%;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),transparent 62%);filter:blur(16px)}
.psh-flecks .fk{position:absolute;border-radius:50%;background:linear-gradient(120deg,#ff3da0,#ffd23d,#7af0c0,#3dd7ff,#a94dff);filter:blur(.6px) saturate(1.9);mix-blend-mode:screen;animation:psh-tw 5s ease-in-out infinite}
@keyframes psh-tw{0%,100%{opacity:.12;transform:rotate(var(--r)) scaleX(var(--sx)) scale(.6)}50%{opacity:1;transform:rotate(var(--r)) scaleX(var(--sx)) scale(1.2)}}

.psh-hero-in{position:relative;z-index:2;max-width:920px;padding:120px 28px 0;color:var(--vert)}
.psh-eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--mauve);margin-bottom:30px}
.psh-hero h1{font-family:'Fraunces',serif;font-weight:300;letter-spacing:-.02em;font-size:clamp(46px,8vw,108px);line-height:1;color:var(--vert);margin-bottom:30px}
.psh-hero h1 em{font-style:italic;color:var(--mauve)}
.psh-hero p{max-width:480px;margin:0 auto 40px;font-size:17px;line-height:1.7;font-weight:300;color:rgba(18,31,24,.7)}
.psh-btn{display:inline-flex;align-items:center;gap:10px;padding:17px 42px;border-radius:60px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#BCA9B7,#94BDB7);transition:transform .4s,box-shadow .4s}
.psh-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 18px 44px rgba(188,169,183,.45)}
.psh-scroll{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:rgba(18,31,24,.45)}
.psh-scroll i{width:1px;height:40px;background:linear-gradient(var(--vert),transparent);animation:psh-ln 2s ease-in-out infinite}
@keyframes psh-ln{0%,100%{opacity:.3;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}

@media(prefers-reduced-motion:reduce){.psh-bubble::before,.psh-flecks .fk,.psh-scroll i{animation:none}}
@media(max-width:900px){
  .psh-nav{padding:14px 22px}.psh-nav.scr{padding:11px 22px}
  .psh-links{display:none}.psh-burger{display:flex}
}
</style>

<div class="psh">
  <!-- NAV -->
  <nav class="psh-nav" id="pshNav">
    <a href="#" class="psh-logo"><span class="psh-bubble"></span>Poeata <em>Chaves</em></a>
    <ul class="psh-links">
      <li><a href="#approche">Approche</a></li>
      <li><a href="#soins">Soins</a></li>
      <li><a href="#apropos">À propos</a></li>
      <li><a href="#contact" class="psh-cta">Rendez-vous</a></li>
    </ul>
    <button class="psh-burger" aria-label="Menu"><span></span><span></span></button>
  </nav>

  <!-- HERO -->
  <header class="psh-hero">
    <div class="psh-flecks" id="pshFlecks"><div class="glow"></div></div>
    <div class="psh-hero-in">
      <p class="psh-eyebrow">Massages &amp; rituels de soins · Paris</p>
      <h1>Un retour à soi,<br><em>en douceur.</em></h1>
      <p>S'arrêter, respirer, se reconnecter. Une parenthèse de lumière pour apaiser le corps et l'esprit.</p>
      <a href="#contact" class="psh-btn">Prendre rendez-vous →</a>
    </div>
    <div class="psh-scroll"><span>Scroll</span><i></i></div>
  </header>
</div>

<script>
(function(){
  var nav=document.getElementById('pshNav');
  window.addEventListener('scroll',function(){nav.classList.toggle('scr',window.scrollY>40)},{passive:true});
  // éclats de prisme dans le hero
  var c=document.getElementById('pshFlecks'); if(c){
    for(var i=0;i<22;i++){var f=document.createElement('span');f.className='fk';
      var b=Math.pow(Math.random(),1.4);
      var x=b*70+Math.random()*30, y=b*55+Math.random()*45;
      var s=(4+Math.random()*14).toFixed(1), r=(100+Math.random()*45).toFixed(1), sx=(1.6+Math.random()*2.4).toFixed(2);
      var d=(3.5+Math.random()*5).toFixed(2), dl=(Math.random()*8).toFixed(2);
      f.style.cssText='left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;--r:'+r+'deg;--sx:'+sx+';animation-duration:'+d+'s;animation-delay:-'+dl+'s';
      c.appendChild(f);}
  }
})();
</script>
