<!-- ============ POEATA CHAVES — HEADER (nav + hero) ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psc-h,.psc-h *{margin:0;padding:0;box-sizing:border-box}
.psc-h{--vert:#121F18;--mauve:#BCA9B7;--sauge:#94BDB7;--creme:#F2F2F2;
  font-family:'Inter',sans-serif;position:relative;width:100%;line-height:1.6;-webkit-font-smoothing:antialiased}
.psc-h a{color:inherit;text-decoration:none}
.psc-h img{display:block;width:100%;height:100%;object-fit:cover}

/* NAV */
.psch-nav{position:fixed;top:0;left:0;width:100%;z-index:60;padding:26px 48px;display:flex;justify-content:space-between;align-items:center;transition:all .5s}
.psch-nav.scr{background:rgba(242,242,242,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px 48px;border-bottom:1px solid rgba(18,31,24,.08)}
.psch-logo{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:22px;color:#fff;transition:color .5s}
.psch-nav.scr .psch-logo{color:var(--vert)}
.psch-logo em{font-style:italic;color:var(--mauve)}
/* ORBE LOGO iridescent (bille dégradée brillante) */
.psch-orb{position:relative;width:34px;height:34px;flex:none;border-radius:50%;overflow:hidden;
  box-shadow:inset -2px -3px 7px rgba(0,0,0,.22),inset 2px 2px 6px rgba(255,255,255,.35),0 3px 10px rgba(0,0,0,.18)}
.psch-orb::before{content:'';position:absolute;inset:-25%;
  background:conic-gradient(from 0deg,#ff7a3d,#ff5db0,#b15cff,#5b8cff,#57c7ff,#9ff5c0,#ffd27a,#ff7a3d);
  animation:psch-spin 14s linear infinite,psch-hue 11s linear infinite}
.psch-orb::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9),rgba(255,255,255,0) 44%)}
@keyframes psch-spin{to{transform:rotate(360deg)}}
@keyframes psch-hue{to{filter:hue-rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.psch-orb::before{animation:none}}
.psch-links{display:flex;gap:36px;align-items:center;list-style:none}
.psch-links a{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff;transition:color .3s}
.psch-nav.scr .psch-links a{color:var(--vert)}
.psch-links a:hover{color:var(--mauve)}
.psch-burger{display:none;flex-direction:column;gap:6px;background:none;border:none;cursor:pointer}
.psch-burger span{width:26px;height:1.5px;background:#fff;transition:.3s}
.psch-nav.scr .psch-burger span{background:var(--vert)}

/* HERO */
.psch-hero{position:relative;height:100vh;min-height:640px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:var(--vert)}
.psch-media{position:absolute;inset:-6% 0;z-index:0}
.psch-media img{width:100%;height:112%;animation:psch-ken 24s ease-in-out infinite alternate}
@keyframes psch-ken{from{transform:scale(1)}to{transform:scale(1.1)}}
/* rayon arc-en-ciel (attrape-soleil) qui balaie */
.psch-prism{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.85;
  background:linear-gradient(101deg,transparent 41%,rgba(255,90,90,.55) 45%,rgba(255,215,90,.55) 48%,rgba(120,235,150,.5) 50.5%,rgba(110,185,255,.55) 53%,rgba(205,135,255,.55) 56%,transparent 60%);
  filter:blur(2px);animation:psch-prism 9s ease-in-out infinite}
@keyframes psch-prism{0%,100%{transform:translateX(-5%)}50%{transform:translateX(5%)}}
.psch-ov{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(8,8,5,.28),rgba(18,31,24,.36))}
.psch-in{position:relative;z-index:3;max-width:900px;padding:0 28px;color:#fff}
.psch-in h1{font-family:'Fraunces',serif;font-weight:300;letter-spacing:-.02em;font-size:clamp(44px,6.5vw,92px);line-height:1.02;color:#fff;margin-bottom:34px}
.psch-in h1 em{font-style:italic;color:#e8d3df}
.psch-sub{max-width:460px;margin:0 auto 36px;font-size:16px;line-height:1.7;font-weight:300;color:rgba(255,255,255,.85)}
.psch-btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 40px;border:1px solid rgba(255,255,255,.75);border-radius:50px;font-size:13px;letter-spacing:.04em;color:#fff;transition:all .4s}
.psch-btn:hover{background:#fff;color:var(--vert);border-color:#fff}
/* apparition */
.psch-rv{opacity:0;transform:translateY(36px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}
.psch-rv.v{opacity:1;transform:none}
.psch-d1{transition-delay:.15s}.psch-d2{transition-delay:.3s}

@media(prefers-reduced-motion:reduce){.psch-media img,.psch-prism{animation:none}}
@media(max-width:900px){
  .psch-nav{padding:18px 22px}.psch-nav.scr{padding:13px 22px}
  .psch-links{display:none}.psch-burger{display:flex}
}
</style>

<div class="psc-h">
  <nav class="psch-nav" id="pschNav">
    <a href="#" class="psch-logo"><span class="psch-orb"></span>Poeata <em>Chaves</em></a>
    <ul class="psch-links">
      <li><a href="#approche">Approche</a></li>
      <li><a href="#soins">Soins</a></li>
      <li><a href="#apropos">À propos</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="psch-burger" aria-label="Menu"><span></span><span></span></button>
  </nav>

  <header class="psch-hero">
    <div class="psch-media">
      <!-- Photo du hero. Remplace l'URL par ta photo quand tu veux. -->
      <img src="https://images.pexels.com/photos/4974360/pexels-photo-4974360.jpeg?auto=compress&cs=tinysrgb&w=1920" alt="Lumière iridescente sur le visage" onerror="this.style.display='none'">
    </div>
    <div class="psch-prism"></div>
    <div class="psch-ov"></div>
    <div class="psch-in">
      <h1 class="psch-rv">Un rituel de soin<br><em>pour chacun·e</em></h1>
      <p class="psch-sub psch-rv psch-d1">Massages &amp; rituels de soins à Paris. Un retour à soi, en douceur.</p>
      <a href="#contact" class="psch-btn psch-rv psch-d2">Découvrir</a>
    </div>
  </header>
</div>

<script>
(function(){
  var nav=document.getElementById('pschNav');
  window.addEventListener('scroll',function(){nav.classList.toggle('scr',window.scrollY>60)},{passive:true});
  setTimeout(function(){document.querySelectorAll('.psc-h .psch-rv').forEach(function(el){el.classList.add('v')})},150);
})();
</script>
