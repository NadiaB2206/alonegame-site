<!-- ====== POEATA CHAVES — LOGO façon vinyle : carré (nom) + disque iridescent qui dépasse à droite et tourne ====== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:40px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE (cercle) : derrière le carré, dépasse à droite, et TOURNE */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-52%,-50%);
  width:clamp(160px,20vw,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  box-shadow:0 12px 34px rgba(120,90,180,.3)}
.psl-disc::before{content:'';position:absolute;inset:-22%;
  background:conic-gradient(from 0deg,#ff9a3d,#ff2f9e,#a94dff,#5b63ff,#57c7ff,#9ff5c0,#ff7ac0,#ff9a3d);
  animation:psl-spin 12s linear infinite}
.psl-disc::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 36% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 42%),
    radial-gradient(circle at 70% 78%,rgba(20,10,40,.28),transparent 55%)}
@keyframes psl-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.psl-disc::before{animation:none}}

/* CARRÉ TRANSPARENT + NOM (même typo que la pochette : sans-serif, lettres espacées) */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:4px;
  background:rgba(240,234,228,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.65);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc"></div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>
