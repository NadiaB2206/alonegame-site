<!-- ====== POEATA CHAVES — LOGO : carré verre (glass) + bulle iridescente avec halo qui dépasse à droite ====== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:48px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE = bulle de verre + halo, derrière le carré, dépasse à droite */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-50%,-50%);
  width:clamp(170px,21vw,240px);aspect-ratio:1}
/* léger halo coloré qui déborde (très subtil) */
.psl-halo{position:absolute;inset:-6%;border-radius:50%;z-index:0;
  background:conic-gradient(from 150deg,#f7d9e2,#fde6c6,#cfeee6,#bfeae4,#d2e2f3,#ecdcf2,#f7d9e2);
  filter:blur(16px);opacity:.35;animation:psl-spin 26s linear infinite}
/* BULLE DE VERRE : corps translucide + anneau de lumière iridescente sur le bord (qui tourne) */
.psl-bubble{position:absolute;inset:0;border-radius:50%;z-index:1;overflow:hidden;
  background:
    /* corps de verre translucide (couvre le centre, laisse voir l'anneau au bord) */
    radial-gradient(circle at 50% 47%, rgba(233,236,244,.96) 0%, rgba(233,236,244,.86) 54%, rgba(233,236,244,.4) 72%, rgba(233,236,244,0) 82%),
    /* anneau iridescent au bord */
    radial-gradient(circle at 50% 90%, rgba(86,228,214,.95), transparent 32%),
    radial-gradient(circle at 80% 75%, rgba(196,240,150,.85), transparent 28%),
    radial-gradient(circle at 91% 52%, rgba(255,201,120,.85), transparent 28%),
    radial-gradient(circle at 15% 50%, rgba(255,182,212,.85), transparent 30%),
    radial-gradient(circle at 50% 11%, rgba(255,206,222,.7), transparent 28%),
    #e9ecf3;
  box-shadow:inset 0 0 26px rgba(255,255,255,.7),inset -5px -8px 20px rgba(165,172,205,.22),0 20px 44px rgba(150,160,200,.24);
  animation:psl-spin 24s linear infinite}
/* reflets fixes : liseré blanc en haut + gros reflet courbé en haut-gauche */
.psl-bubble-gloss{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at 50% 6%, rgba(255,255,255,.95), rgba(255,255,255,0) 22%),
    radial-gradient(72% 52% at 35% 22%, rgba(255,255,255,.92), rgba(255,255,255,0) 60%),
    radial-gradient(30% 20% at 30% 15%, rgba(255,255,255,.95), transparent 70%)}
@keyframes psl-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.psl-halo,.psl-bubble{animation:none}}

/* CARRÉ EN VERRE (glassmorphism) + nom */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 36px rgba(120,130,170,.2),inset 0 1px 1px rgba(255,255,255,.7);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.6);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc">
      <div class="psl-halo"></div>
      <div class="psl-bubble"></div>
      <div class="psl-bubble-gloss"></div>
    </div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>
