<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:48px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE = bulle de verre, derrière le carré, dépasse à droite */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-50%,-50%);
  width:clamp(170px,21vw,240px);aspect-ratio:1}
/* BULLE DE VERRE : corps pâle en haut + lumière iridescente concentrée en bas (rose/cyan/jaune) */
.psl-bubble{position:absolute;inset:0;border-radius:50%;z-index:1;overflow:hidden;
  background:
    radial-gradient(circle at 50% 36%, rgba(249,249,253,.96) 0%, rgba(245,245,251,.72) 46%, rgba(245,245,251,.22) 68%, transparent 80%),
    radial-gradient(circle at 50% 80%, rgba(96,226,224,.92), transparent 36%),
    radial-gradient(circle at 80% 72%, rgba(208,236,140,.85), transparent 32%),
    radial-gradient(circle at 92% 56%, rgba(255,214,132,.82), transparent 32%),
    radial-gradient(circle at 11% 55%, rgba(255,186,206,.82), transparent 36%),
    radial-gradient(circle at 50% 13%, rgba(255,210,222,.5), transparent 30%),
    #edeff5;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.6),
    inset 0 0 24px rgba(255,255,255,.7),
    inset -10px -16px 36px rgba(150,160,200,.3),
    0 26px 54px rgba(150,160,200,.3),
    0 0 44px rgba(200,210,235,.45)}
/* REFLETS VERRE : gros reflet courbé en haut-gauche + point lumineux + liseré haut */
.psl-bubble-gloss{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:
    radial-gradient(60% 42% at 33% 22%, rgba(255,255,255,.92), rgba(255,255,255,0) 60%),
    radial-gradient(24% 15% at 28% 16%, rgba(255,255,255,.98), transparent 70%),
    radial-gradient(circle at 50% 6%, rgba(255,255,255,.55), transparent 24%)}
@keyframes psl-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.psl-bubble{animation:none}}

/* CARRÉ EN VERRE (glassmorphism) + nom */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 36px rgba(120,130,170,.2),inset 0 1px 1px rgba(255,255,255,.7);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.6);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc">
      <div class="psl-bubble"></div>
      <div class="psl-bubble-gloss"></div>
    </div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>
