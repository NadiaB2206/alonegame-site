<!-- ====== POEATA CHAVES — LOGO : carré verre + BULLE DE VERRE 3D (Three.js) qui dépasse à droite ====== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:48px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE = bulle 3D, derrière le carré, dépasse à droite */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-50%,-50%);
  width:clamp(180px,22vw,260px);aspect-ratio:1;border-radius:50%;
  /* secours si la 3D ne charge pas : dégradé bulle */
  background:radial-gradient(circle at 38% 28%, #ffffff, rgba(255,255,255,0) 45%),
             radial-gradient(circle at 50% 82%, #8fe6e0, transparent 40%),
             radial-gradient(circle at 84% 64%, #ffe0a0, transparent 38%),
             radial-gradient(circle at 14% 56%, #ffc2d6, transparent 42%),
             #eef0f6;
  box-shadow:0 22px 50px rgba(150,160,200,.3)}
.psl-disc canvas{width:100%!important;height:100%!important;display:block;border-radius:50%}

/* CARRÉ EN VERRE (glassmorphism) + nom */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 36px rgba(120,130,170,.2),inset 0 1px 1px rgba(255,255,255,.7);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.6);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc"><canvas id="pslCanvas"></canvas></div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

const canvas = document.getElementById('pslCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(0, 0, 5);

// environnement (reflets doux)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// SPHÈRE DE VERRE IRIDESCENTE
const geo = new THREE.SphereGeometry(1.35, 128, 128);
const mat = new THREE.MeshPhysicalMaterial({
  roughness: 0.05, metalness: 0,
  transmission: 1, thickness: 1.4, ior: 1.33,
  iridescence: 1, iridescenceIOR: 1.3, iridescenceThicknessRange: [120, 560],
  clearcoat: 1, clearcoatRoughness: 0.08,
  envMapIntensity: 1.35, transparent: true
});
const ball = new THREE.Mesh(geo, mat);
scene.add(ball);

// lumières colorées (cyan en bas, rose à gauche, jaune à droite) + reflet haut-gauche
const add = (hex,intensity,x,y,z)=>{const p=new THREE.PointLight(hex,intensity,20);p.position.set(x,y,z);scene.add(p);};
add(0x66e6e0, 5, 0, -3, 3);    // cyan bas
add(0xff9ec4, 3.5, -3, -0.5, 3); // rose gauche
add(0xffd27a, 3.5, 3, 1, 3);   // jaune droite
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 1.3); dir.position.set(-2.5, 3, 4); scene.add(dir); // reflet haut-gauche

function resize(){ const s = canvas.clientWidth || 240; renderer.setSize(s, s, false); }
resize(); window.addEventListener('resize', resize);

function loop(t){
  ball.rotation.y = t * 0.00022;
  ball.rotation.x = Math.sin(t * 0.0003) * 0.14;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
