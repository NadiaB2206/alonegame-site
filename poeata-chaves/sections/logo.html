<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:60px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE = sphère de verre 3D + halo, derrière le carré, dépasse à droite */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-50%,-50%);
  width:clamp(180px,22vw,250px);aspect-ratio:1}
/* GROS HALO coloré derrière la sphère */
.psl-halo{position:absolute;inset:-40%;border-radius:50%;z-index:0;
  background:
    radial-gradient(46% 40% at 50% 16%, #ffe79a, transparent 62%),
    radial-gradient(42% 44% at 20% 60%, #ff9ec6, transparent 60%),
    radial-gradient(46% 46% at 80% 54%, #ffce8a, transparent 62%),
    radial-gradient(42% 40% at 56% 90%, #ffd6a0, transparent 60%),
    radial-gradient(36% 36% at 28% 28%, #eaf0a0, transparent 60%),
    radial-gradient(40% 40% at 74% 24%, #f7d8ef, transparent 62%);
  filter:blur(30px);opacity:.9;animation:psl-halo 20s ease-in-out infinite}
@keyframes psl-halo{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
/* canvas 3D */
.psl-disc canvas{position:relative;z-index:1;width:100%!important;height:100%!important;display:block;
  filter:drop-shadow(0 20px 44px rgba(150,160,200,.3))}
/* secours si la 3D ne charge pas */
.psl-disc.fallback{border-radius:50%;background:conic-gradient(from 200deg,#f6d4e0,#fde7c2,#d2eede,#cfe0f5,#ecd9f3,#f6d4e0);box-shadow:inset -10px -14px 30px rgba(150,160,200,.3),0 20px 44px rgba(150,160,200,.3)}
@media(prefers-reduced-motion:reduce){.psl-halo{animation:none}}

/* CARRÉ EN VERRE (glassmorphism) + nom */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 36px rgba(120,130,170,.2),inset 0 1px 1px rgba(255,255,255,.7);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.6);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc" id="pslDisc">
      <div class="psl-halo"></div>
      <canvas id="pslCanvas"></canvas>
    </div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';
try{
  const canvas=document.getElementById('pslCanvas');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(34,1,0.1,100);camera.position.set(0,0,5);
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  const geo=new THREE.SphereGeometry(1.4,128,128);
  const mat=new THREE.MeshPhysicalMaterial({roughness:0.08,metalness:0,transmission:1,thickness:1.3,ior:1.4,
    iridescence:1,iridescenceIOR:1.3,iridescenceThicknessRange:[140,520],clearcoat:1,clearcoatRoughness:0.1,
    envMapIntensity:1.4,transparent:true});
  const ball=new THREE.Mesh(geo,mat);scene.add(ball);
  // lumières dans TA palette pastel
  const add=(h,i,x,y,z)=>{const p=new THREE.PointLight(h,i,20);p.position.set(x,y,z);scene.add(p);};
  add(0xf6d4e0,4,-3,1,3);     // rose
  add(0xd2eede,4,3,-1,3);     // menthe
  add(0xcfe0f5,4,0,-3,3);     // bleu
  add(0xecd9f3,3,2,2,2);      // lavande
  add(0xfde7c2,3,-2,-2,2);    // crème
  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  const dir=new THREE.DirectionalLight(0xffffff,1.2);dir.position.set(-2.5,3,4);scene.add(dir);
  function resize(){const s=canvas.clientWidth||240;renderer.setSize(s,s,false);}
  resize();window.addEventListener('resize',resize);
  (function loop(t){ball.rotation.y=t*0.00025;ball.rotation.x=Math.sin(t*0.0003)*0.12;renderer.render(scene,camera);requestAnimationFrame(loop);})(0);
}catch(e){ document.getElementById('pslDisc').classList.add('fallback'); }
</script>
