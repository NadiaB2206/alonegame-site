<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.psl-wrap{display:flex;justify-content:center;width:100%;padding:48px 0}
.psl,.psl *{margin:0;padding:0;box-sizing:border-box}
.psl{position:relative;display:inline-block;font-family:'Inter',sans-serif}

/* DISQUE = bille 3D, derrière le carré, dépasse à droite */
.psl-disc{position:absolute;z-index:1;top:50%;left:100%;transform:translate(-50%,-50%);
  width:clamp(180px,22vw,250px);aspect-ratio:1}
/* BILLE DE VERRE GLOSSY : couleurs iridescentes qui TOURNENT dans la sphère */
.psl-bubble{position:absolute;inset:0;border-radius:50%;z-index:1;overflow:hidden}
.psl-bubble-color{position:absolute;inset:-12%;border-radius:50%;
  background:conic-gradient(from 220deg,
    #ffd6ec 0deg,#7ac0ff 52deg,#3a6bff 104deg,#7a3df0 150deg,
    #c43df0 188deg,#ff3da0 224deg,#ff7a3d 280deg,#ff9ec6 322deg,#ffd6ec 360deg);
  filter:saturate(1.25);
  animation:psl-spin 13s linear infinite}
/* swirl de lumière (bande claire courbée qui tourne plus lentement) */
.psl-bubble-swirl{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(58% 40% at 42% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 55%);
  animation:psl-spin 19s linear infinite reverse}
/* VOLUME 3D + reflets glossy (fixe, par-dessus) */
.psl-bubble-gloss{position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
  background:
    radial-gradient(70% 52% at 36% 20%, rgba(255,255,255,.95), rgba(255,255,255,0) 56%),
    radial-gradient(26% 16% at 31% 14%, #ffffff, transparent 70%),
    radial-gradient(120% 80% at 50% 118%, rgba(255,255,255,.35), transparent 52%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.45),
    inset 12px 14px 30px rgba(255,255,255,.4),
    inset -16px -22px 48px rgba(40,20,80,.5),
    0 26px 56px rgba(120,90,190,.5)}
@keyframes psl-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.psl-bubble-color,.psl-bubble-swirl{animation:none}}

/* CARRÉ EN VERRE (glassmorphism) + nom */
.psl-card{position:relative;z-index:2;width:clamp(230px,28vw,320px);aspect-ratio:1;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 10px 36px rgba(120,130,170,.2),inset 0 1px 1px rgba(255,255,255,.7);
  display:grid;place-items:center}
.psl-name{text-align:center;color:#11110f}
.psl-name .l{display:block;font-size:clamp(26px,3.6vw,42px);font-weight:400;letter-spacing:.36em;text-transform:uppercase;text-indent:.36em;line-height:1.15}
.psl-name .sub{display:block;margin-top:16px;font-size:9px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(17,17,15,.6);text-indent:.42em}
</style>

<div class="psl-wrap">
  <a href="#" class="psl" style="text-decoration:none">
    <div class="psl-disc">
      <div class="psl-bubble">
        <div class="psl-bubble-color"></div>
        <div class="psl-bubble-swirl"></div>
      </div>
      <div class="psl-bubble-gloss"></div>
    </div>
    <div class="psl-card">
      <div class="psl-name">
        <span class="l">Poeata</span>
        <span class="l">Chaves</span>
        <span class="sub">Massages &amp; soins</span>
      </div>
    </div>
  </a>
</div>
