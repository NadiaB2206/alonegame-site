<!-- ====== POEATA CHAVES — ATTRAPE-SOLEIL : éclats de prisme arc-en-ciel dispersés ======
  Coin lumineux en haut-gauche + dizaines de mini-reflets iridescents qui scintillent,
  comme la lumière du soleil à travers un film attrape-soleil. À placer UNE fois sur la page. -->
<style>
.psun2{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* source de lumière (coin haut-gauche) */
.psun2 .glow{position:absolute;top:-18%;left:-14%;width:70vw;height:70vw;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.4) 32%,transparent 64%);
  filter:blur(18px)}
/* éclats de prisme (générés en JS) */
.psun2 .fleck{position:absolute;border-radius:50%;
  background:linear-gradient(120deg,#ff3da0 0%,#ffd23d 26%,#7af0c0 50%,#3dd7ff 74%,#a94dff 100%);
  filter:blur(.6px) saturate(1.9);mix-blend-mode:screen;
  animation-name:psun2-tw;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes psun2-tw{
  0%,100%{opacity:.12;transform:rotate(var(--r)) scaleX(var(--sx)) scale(.6)}
  50%    {opacity:1;  transform:rotate(var(--r)) scaleX(var(--sx)) scale(1.2)}
}
@media(prefers-reduced-motion:reduce){.psun2 .fleck{animation:none;opacity:.7}}
</style>

<div class="psun2" aria-hidden="true"><div class="glow"></div></div>

<script>
(function(){
  var c=document.querySelector('.psun2'); if(!c) return;
  var N=34;
  for(var i=0;i<N;i++){
    var f=document.createElement('span'); f.className='fleck';
    // densité plus forte vers le coin haut-gauche
    var bias=Math.pow(Math.random(),1.5);
    var x=(bias*70 + Math.random()*30);          // %
    var y=(bias*60 + Math.random()*40);           // %
    var size=(4+Math.random()*16).toFixed(1);     // px
    var rot=(100+Math.random()*45).toFixed(1);    // diagonale
    var sx=(1.6+Math.random()*2.6).toFixed(2);    // étirement (streak)
    var dur=(3.5+Math.random()*6).toFixed(2);
    var delay=(Math.random()*9).toFixed(2);
    f.style.cssText='left:'+x+'%;top:'+y+'%;width:'+size+'px;height:'+size+'px;'
      +'--r:'+rot+'deg;--sx:'+sx+';animation-duration:'+dur+'s;animation-delay:-'+delay+'s';
    c.appendChild(f);
  }
})();
</script>
